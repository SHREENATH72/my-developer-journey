<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form</title>
    <style>
        *{
            user-select: none;
        }
    </style>
</head>
<body>
    <form>
        
        <h1>Job Application</h1>

        <label for="name">Full Name: </label>
        <input type="text" id="name" name="name">
        </br>
        </br>

        <label for="email">Email Id: </label>
        <input type="email" id="email" name="email">
        </br>
        </br>

        <label for="phone">Phone No: </label>
        <input type="tel" id="phone" name="phone">
        </br>
        </br>

        <label for="file">Resume: </label>
        <input type="file" id="file" name="file">
        </br>
        </br>

        <label for="exp">Experience(in years): </label>
        <input type="number" id="exp" name="exp" min="0" max="50">
        </br>
        </br>

        <label for="edu">Highest Education: </label>
        <select id="edu" name="edu">
            <option value="highschool">High School</option>
            <option value="bachelor">Bachelor's Degree</option>
            <option value="master">Master's Degree</option>
            <option value="phd">PhD</option>
        </select>
        </br>
        </br>

        <fieldset>
            <legend>Skills</legend>

            <label for="check1">HTML</label>
            <input type="checkbox" id="check1" name="skill">

            <label for="check2">CSS</label>
            <input type="checkbox" id="check2" name="skill">

            <label for="check3">JavaScript</label>
            <input type="checkbox" id="check3" name="skill">
        </fieldset>
        </br>
        
        <fieldset>
            <legend>Availability</legend>
            
            <label for="radio1">Full-time: </label>
            <input type="radio" id="radio1" name="availability">
            
            <label for="radio2">Part-time: </label>
            <input type="radio" id="radio2" name="availability">
        </fieldset>
        </br>

        <label for="text">Additonal Comments: </label>
        </br>
        <textarea id="text" name="text" rows="4" cols="30"></textarea>
        </br>
        </br>

        <input type="submit" value="Submit Application">
    </form>   
</body>
</html>
